# Local development services. Start with `pnpm docker:up`.
# Values come from .env (copy .env.example); the defaults below match it.
name: jbt

services:
  postgres:
    # Same major version as production (Neon's default is Postgres 18).
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jbt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jbt}
      POSTGRES_DB: ${POSTGRES_DB:-jbt_dev}
    ports:
      # 5433 on your machine, because your Windows Postgres already uses 5432.
      # 127.0.0.1 = reachable only from this computer, not your network.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql (not .../data).
      - postgres-data:/var/lib/postgresql
      # SQL files here run once, when the volume is first created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches every email the app sends. Inbox: http://localhost:8025
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP: the app sends here
      - '127.0.0.1:8025:8025' # Web inbox

volumes:
  postgres-data:
