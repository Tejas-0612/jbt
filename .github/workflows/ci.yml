# Continuous integration. On every push to main and every pull request, GitHub starts
# a fresh Linux machine, follows the README's "Getting started", and runs every check.
# Learning notes: docs/learning/ci.md (local only).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Adds a "Run workflow" button on the Actions tab.
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    name: Check
    # Pinned, so a new "ubuntu-latest" can't change the machine under us.
    runs-on: ubuntu-24.04
    # A stuck job is stopped instead of using up the monthly minutes.
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          # Don't leave the access token in .git/config: CI never pushes.
          persist-credentials: false

      # Installs the pnpm version from "packageManager" in package.json.
      # Third-party action: pinned to the exact commit of v6.1.0 (a tag can be moved, a commit can't).
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node version from .nvmrc. Caches pnpm's download store between runs (key: pnpm-lock.yaml).
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails if pnpm-lock.yaml doesn't match the package.json files, instead of changing it.
      # Also generates the Prisma client (postinstall in apps/api).
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Same as the README. If a required setting is missing from .env.example, CI fails.
      - name: Create .env from .env.example
        run: cp .env.example .env

      # Our own docker-compose.yml, Postgres only (nothing sends email yet). The machine is new
      # every run, so the init script creates jbt_test and the database starts empty.
      # --wait returns once the healthcheck says Postgres is ready.
      - name: Start Postgres
        run: docker compose up -d --wait postgres

      # Each check runs even if an earlier one failed, so one run shows every problem.
      # They are skipped only if the install failed (then they would all fail for the same reason).
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      # Not part of `pnpm check`, but a deploy needs it, and some errors only show in `vite build`.
      - name: Build web app
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @jbt/web build

      # Only when something failed: Postgres's own log, in case the database was the cause.
      - name: Show Postgres logs
        if: ${{ failure() }}
        run: docker compose logs postgres
